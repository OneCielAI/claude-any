name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@oneciel-ai"
      - run: python -m pip install --upgrade pip ruff pillow
      - run: python -m py_compile claude_any.py claude-any-menu.py claude-any-tool-guard.py scripts/make_demo_assets.py
      - run: python -m ruff check .
      - id: publish-check
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
            echo "Package ${pkg}@${version} is already published; skipping npm publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${pkg}@${version} is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.publish-check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
